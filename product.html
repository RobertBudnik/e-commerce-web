<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Karta produktu — Nordo.">
  <title>Produkt — Nordo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">Nordo</a>
    <nav class="nav">
      <a href="index.html">Start</a>
      <a href="shop.html">Sklep</a>
    </nav>
    <div class="header-actions">
      <div class="account-menu" data-account></div>
      <a class="btn btn-ghost btn-sm cart-btn" href="cart.html">
        Koszyk
        <span class="cart-count" data-cart-count hidden>0</span>
      </a>
    </div>
  </div>
</header>

<main class="container">
  <nav class="breadcrumbs" aria-label="Ścieżka nawigacji">
    <a href="index.html">Start</a><span class="sep">/</span><a href="shop.html">Sklep</a><span class="sep">/</span><span data-crumb>Produkt</span>
  </nav>

  <div class="product" data-product></div>

  <hr class="rule">

  <section class="section">
    <div class="section-head">
      <div>
        <span class="label">Z tej samej kategorii</span>
        <h2>Podobne produkty</h2>
      </div>
      <a class="arrow-link" href="shop.html">Wszystkie produkty</a>
    </div>
    <div class="grid" data-grid="related"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="margin-top:0">
      <span>© 2026 Nordo</span>
      <a href="shop.html">Wróć do sklepu</a>
    </div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
