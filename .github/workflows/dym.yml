name: Dym po wdrożeniu

# Vercel sam buduje podgląd z każdego PR-a i po zakończeniu zgłasza to
# GitHubowi zdarzeniem `deployment_status`. Podpinamy się pod gotowy wynik
# zamiast budować drugi raz u siebie: bez tokenów Vercela w sekretach,
# bez dublowania buildu i bez minut Actions na kompilację.
on:
  deployment_status:

concurrency:
  group: dym-${{ github.event.deployment_status.environment_url }}
  cancel-in-progress: true

jobs:
  dym:
    name: Testy dymne
    # Zdarzenie przychodzi też dla stanów `pending` i `failure` — te nas
    # nie interesują, bo nie ma czego odpytywać.
    #
    # Wyłącznie wdrożenia produkcyjne. Adresy podglądu Vercela stoją za
    # ochroną wdrożeń: żądanie bez sesji dostaje 302 na logowanie, więc każdy
    # test szukał treści w formularzu SSO i wszystkie padały. Ten workflow był
    # przez to czerwony na każdym przebiegu w historii repozytorium, także na
    # commitach z zieloną resztą CI — czyli nie mówił niczego poza tym, że
    # zawsze świeci na czerwono.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Zdarzenie niesie SHA wdrożonego commita, nie czubek gałęzi —
          # testy mają odpowiadać temu, co faktycznie stoi pod adresem.
          ref: ${{ github.event.deployment_status.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Zależności
        run: npm ci --prefix web

      - name: Przeglądarka do Playwrighta
        run: npx --prefix web playwright install --with-deps chromium

      # `environment_url` niesie adres pojedynczego wdrożenia
      # (nordo-<hash>-<konto>.vercel.app), a ten jest chroniony niezależnie od
      # tego, czy wdrożenie jest produkcyjne. Publiczny jest dopiero alias, więc
      # bierzemy go ze zmiennej repozytorium — zmiana domeny to wtedy wpis
      # w ustawieniach, nie commit. Wartość awaryjna celuje w obecny adres.
      - name: Dym
        env:
          E2E_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://nordo-one.vercel.app' }}
        run: npm --prefix web run test:smoke

      - name: Ślady nieudanych testów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dym-${{ github.event.deployment_status.deployment.sha }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
