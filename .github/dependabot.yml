version: 2

updates:
  # Trzy osobne manifesty: narzędzia w korzeniu, front w web/, akcje w CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Next, React i typy chodzą parami — osobne PR-y na każdą paczkę tylko
      # mnożą konflikty w package-lock.
      next:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@types/react*'
      supabase:
        patterns:
          - '@supabase/*'
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
