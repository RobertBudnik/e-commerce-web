version: 2

updates:
  # Trzy osobne manifesty: narzędzia w korzeniu, front w web/, akcje w CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Next, React i typy chodzą parami — osobne PR-y na każdą paczkę tylko
      # mnożą konflikty w package-lock.
      next:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@types/react*'
      supabase:
        patterns:
          - '@supabase/*'
      dev:
        dependency-type: development
    # Trzy paczki narzędziowe chodzą w parze z Nextem 15 i majorem wyżej
    # rozwalają build. Sprawdzone: TypeScript 7 wywraca ładowanie
    # `next.config.ts` („Cannot read properties of undefined (reading
    # 'fileExists')"), przewraca `tsc` na imporcie CSS (TS2882) i wywala
    # typescript-eslint komunikatem „does not support TS 7.0". ESLint 10
    # z `eslint-config-next` 16 pada na `FlatCompat` (circular structure).
    #
    # Blokada zdejmowana ręcznie razem z podniesieniem Nexta do 16.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-config-next
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
